<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self'; img-src 'self' data: blob:">
  <link rel="stylesheet" href="hud.css">
  <link rel="stylesheet" href="airplay.css">
  <script defer src="tesseract.min.js"></script>
  <script defer src="read-hud.js"></script>
</head>
<body>
  <main class="hud mode-game contrast-high">
    <div class="hud-stage is-mirrored">
      <div class="hud-layer">
        <div class="hud-top">
          <div id="waiting" class="hud-status">Очікуємо навігацію</div>
          <div id="maneuver" class="hud-maneuver" hidden>
            <svg id="arrow" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-6a5 5 0 0 1 5-5h10m-5-5 5 5-5 5"/></svg>
            <div><div id="distance" class="hud-dist"></div><div id="street" class="hud-instr"></div></div>
          </div>
        </div>
        <div class="hud-bottom"><div id="trip" class="hud-eta" hidden><strong id="arrival"></strong><span id="remaining"></span></div></div>
      </div>
    </div>
  </main>
</body>
</html>
