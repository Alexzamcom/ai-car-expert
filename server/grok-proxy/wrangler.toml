# Cloudflare Worker: прокси AI Car Expert → xAI Grok.
# Секреты (НЕ хранить в репозитории):
#   npx wrangler secret put XAI_API_KEY    # ключ из console.x.ai
#   npx wrangler secret put ACCESS_TOKEN   # длинная случайная строка; её же ввести в приложении
name = "ai-car-expert-grok"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://alexzamcom.github.io"
# Идентификатор модели проверьте в console.x.ai → Models: названия моделей меняются.
GROK_MODEL = "grok-4"
MAX_TOKENS = "700"
RATE_LIMIT_PER_MIN = "30"
