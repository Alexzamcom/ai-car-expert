name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [feature/android-capacitor-apk, codex/gps-denied-navigation]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned SDK components
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm test
      - name: Build Android assets and sync native plugins
        run: npm run android:sync
      - name: Compile Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify signature, package and foreground permissions
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" | grep "^package: name='com.aicarexpert.app'"
          "$tools/aapt" dump permissions "$apk" > apk-permissions.txt
          grep -F "android.permission.ACCESS_COARSE_LOCATION" apk-permissions.txt
          grep -F "android.permission.ACCESS_FINE_LOCATION" apk-permissions.txt
          if grep -Eq 'ACCESS_BACKGROUND_LOCATION|FOREGROUND_SERVICE_LOCATION' apk-permissions.txt; then exit 1; fi
          unzip -Z1 "$apk" > apk-entries.txt
          grep -Fx 'assets/public/index.html' apk-entries.txt
          grep -E '^assets/public/assets/maplibre-gl-worker-.*\.mjs$' apk-entries.txt
          if grep -Fxq 'assets/public/sw.js' apk-entries.txt; then exit 1; fi
      - name: Upload installable APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: ai-car-expert-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Installation link
        run: echo '[Download the Android debug APK artifact](${{ steps.apk.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"

  emulator-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ai-car-expert-android-debug-apk
          path: apk
      - run: npm install --no-save --package-lock=false playwright@1.49.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: node scripts/android-smoke.mjs apk/app-debug.apk
