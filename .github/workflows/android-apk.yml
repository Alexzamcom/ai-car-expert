name: Android debug APK

on:
  pull_request:
    paths: [scripts/android-signing-upgrade-check.mjs, android/**, src/lib/autonomy/**, src/sections/AutonomousNavigation.tsx, .github/workflows/android-apk.yml]
  workflow_dispatch:
    inputs:
      stable_signature:
        description: Sign with the protected Android test certificate
        type: boolean
        default: false
  push:
    branches: [feature/android-capacitor-apk, codex/android-offline-recovery]

permissions:
  contents: read

jobs:
  android:
    if: (github.event_name != 'pull_request' && (github.ref != 'refs/heads/codex/android-offline-recovery' || github.event_name == 'workflow_dispatch' || vars.ANDROID_TEST_STABLE_SIGNING == 'true')) || (github.event_name == 'pull_request' && contains(fromJSON('["codex/gps-denied-navigation","codex/note9-navigation-hud","codex/android-navigation-ux","codex/android-offline-smooth","codex/android-hybrid-position","codex/android-confirmed-route","codex/android-navigation-scale","codex/android-location-bootstrap","codex/game-hud","codex/android-road-test","codex/android-location-report","codex/android-position-visibility","codex/android-offline-routing","codex/android-offline-download","codex/android-route-planner","codex/android-offline-recovery"]'), github.head_ref) && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned SDK components
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm test
      - name: Build Android assets and sync native plugins
        run: npm run android:sync
      - name: Compile Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify signature, package and foreground permissions
        env:
          VERIFY_LOCAL_ROUTER: ${{ (github.head_ref == 'codex/android-offline-routing' || (github.head_ref == 'codex/android-offline-download' || (github.head_ref == 'codex/android-route-planner' || github.head_ref == 'codex/android-offline-recovery'))) && '1' || '0' }}
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" | grep "^package: name='com.aicarexpert.app'"
          "$tools/aapt" dump permissions "$apk" > apk-permissions.txt
          grep -F "android.permission.ACCESS_COARSE_LOCATION" apk-permissions.txt
          grep -F "android.permission.ACCESS_FINE_LOCATION" apk-permissions.txt
          if grep -Eq 'ACCESS_BACKGROUND_LOCATION|FOREGROUND_SERVICE_LOCATION' apk-permissions.txt; then exit 1; fi
          unzip -Z1 "$apk" > apk-entries.txt
          grep -Fx 'assets/public/index.html' apk-entries.txt
          grep -E '^assets/public/assets/maplibre-gl-worker-.*\.mjs$' apk-entries.txt
          if [ "$VERIFY_LOCAL_ROUTER" = 1 ]; then
            grep -E '^assets/public/assets/valhalla-.*\.wasm$' apk-entries.txt
            grep -E '^assets/public/assets/offlineRouter\.worker-.*\.js$' apk-entries.txt
          fi
          if grep -Fxq 'assets/public/sw.js' apk-entries.txt; then exit 1; fi
      - name: Upload installable APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: ai-car-expert-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Installation link
        run: echo '[Download the Android debug APK artifact](${{ steps.apk.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"

  stable-signing:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.stable_signature) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/android-offline-recovery' &&
      vars.ANDROID_TEST_STABLE_SIGNING == 'true')
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-test-signing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-car-expert-android-debug-apk
          path: input
      - name: Install Android signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Sign and verify the pinned certificate
        shell: bash
        env:
          ACE_SIGNING_KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ACE_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_TEST_STORE_PASSWORD }}
          ACE_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
          ACE_SIGNING_ALIAS: ${{ vars.ANDROID_TEST_KEY_ALIAS }}
          ACE_SIGNING_SHA256: ${{ vars.ANDROID_TEST_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${ACE_SIGNING_KEYSTORE:?Configure the keystore in the protected environment}"
          : "${ACE_SIGNING_STORE_PASSWORD:?Missing keystore password}"
          : "${ACE_SIGNING_KEY_PASSWORD:?Missing key password}"
          : "${ACE_SIGNING_ALIAS:?Missing key alias}"
          expected="${ACE_SIGNING_SHA256,,}"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "Set the expected certificate SHA-256"; exit 1; }
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$ACE_SIGNING_KEYSTORE" | base64 --decode > "$signing_dir/test.keystore"
          unset ACE_SIGNING_KEYSTORE
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" sign --ks "$signing_dir/test.keystore" --ks-key-alias "$ACE_SIGNING_ALIAS" \
            --ks-pass env:ACE_SIGNING_STORE_PASSWORD --key-pass env:ACE_SIGNING_KEY_PASSWORD \
            --v4-signing-enabled false --out ai-car-expert-test.apk input/app-debug.apk
          report="$("$tools/apksigner" verify --min-sdk-version 29 --print-certs ai-car-expert-test.apk)"
          actual="$(awk '/^Signer #[0-9]+ certificate SHA-256 digest:/ { print $NF }' <<< "$report")"
          [[ "$actual" == "$expected" ]] || { echo "Unexpected APK signing certificate"; exit 1; }
          echo "APK signing certificate SHA-256 $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-car-expert-android-stable-test-apk
          path: ai-car-expert-test.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ai-car-expert-android-debug-apk
          path: apk
      - run: npm install --no-save --package-lock=false playwright@1.49.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare Android API 35 system image
        run: |
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Prepare a same-certificate pair for the upgrade test
        if: github.head_ref == 'codex/android-offline-recovery'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p upgrade/original
          if ! gh run download 45549983820 --repo "$GITHUB_REPOSITORY" \
            --name ai-car-expert-android-debug-apk --dir upgrade/original; then
            echo "::warning::PR #59 APK unavailable. The in-place upgrade test is skipped."
            exit 0
          fi
          baseline=upgrade/original/app-debug.apk
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          export ACE_UPGRADE_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 2 \
            -alias upgrade -dname 'CN=Disposable Android Upgrade Test' \
            -keystore "$RUNNER_TEMP/ace-upgrade.p12" -storepass:env ACE_UPGRADE_PASSWORD
          trap 'rm -f "$RUNNER_TEMP/ace-upgrade.p12"' EXIT
          for item in baseline updated; do
            apk="$baseline"
            if [ "$item" = updated ]; then apk=apk/app-debug.apk; fi
            "$apksigner" sign --ks "$RUNNER_TEMP/ace-upgrade.p12" --ks-key-alias upgrade \
              --ks-pass env:ACE_UPGRADE_PASSWORD --out "upgrade/$item.apk" "$apk"
            "$apksigner" verify --min-sdk-version 29 "upgrade/$item.apk"
          done
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPECT_ROUTE_PLANNER: ${{ (github.head_ref == 'codex/android-route-planner' || github.head_ref == 'codex/android-offline-recovery') && '1' || '0' }}
          EXPECT_PHONE_PICKER: ${{ (github.head_ref == 'codex/android-position-visibility' || (github.head_ref == 'codex/android-offline-routing' || (github.head_ref == 'codex/android-offline-download' || (github.head_ref == 'codex/android-route-planner' || github.head_ref == 'codex/android-offline-recovery')))) && '1' || '0' }}
          EXPECT_NAVIGATION_SCALE: ${{ (github.head_ref == 'codex/android-navigation-scale' || (github.head_ref == 'codex/android-location-bootstrap' || (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || (github.head_ref == 'codex/android-position-visibility' || (github.head_ref == 'codex/android-offline-routing' || (github.head_ref == 'codex/android-offline-download' || (github.head_ref == 'codex/android-route-planner' || github.head_ref == 'codex/android-offline-recovery'))))))))) && '1' || '0' }}
          EXPECT_ANDROID_UX: ${{ (github.head_ref == 'codex/android-navigation-ux' || (github.head_ref == 'codex/android-offline-smooth' || (github.head_ref == 'codex/android-hybrid-position' || (github.head_ref == 'codex/android-confirmed-route' || (github.head_ref == 'codex/android-navigation-scale' || (github.head_ref == 'codex/android-location-bootstrap' || (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || (github.head_ref == 'codex/android-position-visibility' || (github.head_ref == 'codex/android-offline-routing' || (github.head_ref == 'codex/android-offline-download' || (github.head_ref == 'codex/android-route-planner' || github.head_ref == 'codex/android-offline-recovery'))))))))))))) && '1' || '0' }}
          EXPECT_CONFIRMED_ROUTE: ${{ (github.head_ref == 'codex/android-confirmed-route' || (github.head_ref == 'codex/android-navigation-scale' || (github.head_ref == 'codex/android-location-bootstrap' || (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || (github.head_ref == 'codex/android-position-visibility' || (github.head_ref == 'codex/android-offline-routing' || (github.head_ref == 'codex/android-offline-download' || (github.head_ref == 'codex/android-route-planner' || github.head_ref == 'codex/android-offline-recovery')))))))))) && '1' || '0' }}
          EXPECT_NATIVE_POSITION: ${{ (github.head_ref == 'codex/android-hybrid-position' || (github.head_ref == 'codex/android-confirmed-route' || (github.head_ref == 'codex/android-navigation-scale' || (github.head_ref == 'codex/android-location-bootstrap' || (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || (github.head_ref == 'codex/android-position-visibility' || (github.head_ref == 'codex/android-offline-routing' || (github.head_ref == 'codex/android-offline-download' || (github.head_ref == 'codex/android-route-planner' || github.head_ref == 'codex/android-offline-recovery'))))))))))) && '1' || '0' }}
          EXPECT_AUTONOMY: ${{ contains(fromJSON('["codex/gps-denied-navigation","codex/note9-navigation-hud","codex/android-navigation-ux","codex/android-offline-smooth","codex/android-hybrid-position","codex/android-confirmed-route","codex/android-navigation-scale","codex/android-location-bootstrap","codex/game-hud","codex/android-road-test","codex/android-location-report","codex/android-position-visibility","codex/android-offline-routing","codex/android-offline-download","codex/android-route-planner","codex/android-offline-recovery"]'), github.head_ref) && '1' || '0' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            if [ -f upgrade/updated.apk ]; then node scripts/android-signing-upgrade-check.mjs upgrade/baseline.apk upgrade/updated.apk; fi
            node scripts/android-smoke.mjs apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'codex/android-navigation-ux' || (github.head_ref == 'codex/android-offline-smooth' || (github.head_ref == 'codex/android-hybrid-position' || (github.head_ref == 'codex/android-confirmed-route' || (github.head_ref == 'codex/android-navigation-scale' || (github.head_ref == 'codex/android-location-bootstrap' || (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || (github.head_ref == 'codex/android-position-visibility' || (github.head_ref == 'codex/android-offline-routing' || (github.head_ref == 'codex/android-offline-download' || (github.head_ref == 'codex/android-route-planner' || github.head_ref == 'codex/android-offline-recovery'))))))))))))
        with:
          name: android-navigation-screens
          path: android-navigation-screens/*.png
          if-no-files-found: error

  android-10-install:
    if: contains(fromJSON('["codex/note9-navigation-hud","codex/android-navigation-ux","codex/android-offline-smooth","codex/android-hybrid-position","codex/android-confirmed-route","codex/android-navigation-scale","codex/android-location-bootstrap","codex/game-hud","codex/android-road-test","codex/android-location-report","codex/android-position-visibility","codex/android-offline-routing","codex/android-offline-download","codex/android-route-planner","codex/android-offline-recovery"]'), github.head_ref)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        if: (github.head_ref == 'codex/android-navigation-scale' || (github.head_ref == 'codex/android-location-bootstrap' || (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || (github.head_ref == 'codex/android-position-visibility' || (github.head_ref == 'codex/android-offline-routing' || (github.head_ref == 'codex/android-offline-download' || (github.head_ref == 'codex/android-route-planner' || github.head_ref == 'codex/android-offline-recovery')))))))))
      - uses: actions/download-artifact@v4
        with:
          name: ai-car-expert-android-debug-apk
          path: apk
      - uses: actions/setup-node@v4
        if: (github.head_ref == 'codex/android-navigation-scale' || (github.head_ref == 'codex/android-location-bootstrap' || (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || (github.head_ref == 'codex/android-position-visibility' || (github.head_ref == 'codex/android-offline-routing' || (github.head_ref == 'codex/android-offline-download' || (github.head_ref == 'codex/android-route-planner' || github.head_ref == 'codex/android-offline-recovery')))))))))
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.49.1
        if: (github.head_ref == 'codex/android-navigation-scale' || (github.head_ref == 'codex/android-location-bootstrap' || (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || (github.head_ref == 'codex/android-position-visibility' || (github.head_ref == 'codex/android-offline-routing' || (github.head_ref == 'codex/android-offline-download' || (github.head_ref == 'codex/android-route-planner' || github.head_ref == 'codex/android-offline-recovery')))))))))
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare Android API 29 system image
        run: |
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-29;google_apis;x86_64'; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPECT_ANDROID_UX: '1'
          EXPECT_NATIVE_POSITION: '1'
          EXPECT_PHONE_PICKER: ${{ (github.head_ref == 'codex/android-position-visibility' || (github.head_ref == 'codex/android-offline-routing' || (github.head_ref == 'codex/android-offline-download' || (github.head_ref == 'codex/android-route-planner' || github.head_ref == 'codex/android-offline-recovery')))) && '1' || '0' }}
          EXPECT_NAVIGATION_SCALE: '1'
          ANDROID_DRIVE_CHECK: ${{ (github.head_ref == 'codex/android-navigation-scale' || (github.head_ref == 'codex/android-location-bootstrap' || (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || (github.head_ref == 'codex/android-position-visibility' || (github.head_ref == 'codex/android-offline-routing' || (github.head_ref == 'codex/android-offline-download' || (github.head_ref == 'codex/android-route-planner' || github.head_ref == 'codex/android-offline-recovery'))))))))) && '1' || '0' }}
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: if [ "$ANDROID_DRIVE_CHECK" = 1 ]; then node scripts/android-smoke.mjs apk/app-debug.apk; else adb install apk/app-debug.apk && adb shell am start -W -n com.aicarexpert.app/.MainActivity && adb shell pidof com.aicarexpert.app; fi
