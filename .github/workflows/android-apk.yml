name: Android debug APK

on:
  pull_request:
    paths: [android/**, src/lib/autonomy/**, src/sections/AutonomousNavigation.tsx, .github/workflows/android-apk.yml]
  workflow_dispatch:
  push:
    branches: [feature/android-capacitor-apk]

permissions:
  contents: read

jobs:
  android:
    if: github.event_name != 'pull_request' || (contains(fromJSON('["codex/gps-denied-navigation","codex/note9-navigation-hud","codex/android-navigation-ux","codex/android-offline-smooth","codex/android-hybrid-position","codex/android-confirmed-route","codex/android-navigation-scale"]'), github.head_ref) && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned SDK components
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm test
      - name: Build Android assets and sync native plugins
        run: npm run android:sync
      - name: Compile Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify signature, package and foreground permissions
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" | grep "^package: name='com.aicarexpert.app'"
          "$tools/aapt" dump permissions "$apk" > apk-permissions.txt
          grep -F "android.permission.ACCESS_COARSE_LOCATION" apk-permissions.txt
          grep -F "android.permission.ACCESS_FINE_LOCATION" apk-permissions.txt
          if grep -Eq 'ACCESS_BACKGROUND_LOCATION|FOREGROUND_SERVICE_LOCATION' apk-permissions.txt; then exit 1; fi
          unzip -Z1 "$apk" > apk-entries.txt
          grep -Fx 'assets/public/index.html' apk-entries.txt
          grep -E '^assets/public/assets/maplibre-gl-worker-.*\.mjs$' apk-entries.txt
          if grep -Fxq 'assets/public/sw.js' apk-entries.txt; then exit 1; fi
      - name: Upload installable APK
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: ai-car-expert-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Installation link
        run: echo '[Download the Android debug APK artifact](${{ steps.apk.outputs.artifact-url }})' >> "$GITHUB_STEP_SUMMARY"

  emulator-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ai-car-expert-android-debug-apk
          path: apk
      - run: npm install --no-save --package-lock=false playwright@1.49.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare Android API 35 system image
        run: |
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64'; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPECT_NAVIGATION_SCALE: ${{ github.head_ref == 'codex/android-navigation-scale' && '1' || '0' }}
          EXPECT_ANDROID_UX: ${{ (github.head_ref == 'codex/android-navigation-ux' || (github.head_ref == 'codex/android-offline-smooth' || (github.head_ref == 'codex/android-hybrid-position' || (github.head_ref == 'codex/android-confirmed-route' || github.head_ref == 'codex/android-navigation-scale')))) && '1' || '0' }}
          EXPECT_CONFIRMED_ROUTE: ${{ (github.head_ref == 'codex/android-confirmed-route' || github.head_ref == 'codex/android-navigation-scale') && '1' || '0' }}
          EXPECT_NATIVE_POSITION: ${{ (github.head_ref == 'codex/android-hybrid-position' || (github.head_ref == 'codex/android-confirmed-route' || github.head_ref == 'codex/android-navigation-scale')) && '1' || '0' }}
          EXPECT_AUTONOMY: ${{ contains(fromJSON('["codex/gps-denied-navigation","codex/note9-navigation-hud","codex/android-navigation-ux","codex/android-offline-smooth","codex/android-hybrid-position","codex/android-confirmed-route","codex/android-navigation-scale"]'), github.head_ref) && '1' || '0' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: node scripts/android-smoke.mjs apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'codex/android-navigation-ux' || (github.head_ref == 'codex/android-offline-smooth' || (github.head_ref == 'codex/android-hybrid-position' || (github.head_ref == 'codex/android-confirmed-route' || github.head_ref == 'codex/android-navigation-scale')))
        with:
          name: android-navigation-screens
          path: android-navigation-screens/*.png
          if-no-files-found: error

  android-10-install:
    if: contains(fromJSON('["codex/note9-navigation-hud","codex/android-navigation-ux","codex/android-offline-smooth","codex/android-hybrid-position","codex/android-confirmed-route","codex/android-navigation-scale"]'), github.head_ref)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        if: github.head_ref == 'codex/android-navigation-scale'
      - uses: actions/download-artifact@v4
        with:
          name: ai-car-expert-android-debug-apk
          path: apk
      - uses: actions/setup-node@v4
        if: github.head_ref == 'codex/android-navigation-scale'
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.49.1
        if: github.head_ref == 'codex/android-navigation-scale'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare Android API 29 system image
        run: |
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-29;google_apis;x86_64'; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPECT_ANDROID_UX: '1'
          EXPECT_NATIVE_POSITION: '1'
          EXPECT_NAVIGATION_SCALE: '1'
          ANDROID_DRIVE_CHECK: ${{ github.head_ref == 'codex/android-navigation-scale' && '1' || '0' }}
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: >-
            if [ "$ANDROID_DRIVE_CHECK" = 1 ]; then
              node scripts/android-smoke.mjs apk/app-debug.apk;
            else
              adb install apk/app-debug.apk && adb shell am start -W -n com.aicarexpert.app/.MainActivity && adb shell pidof com.aicarexpert.app;
            fi
