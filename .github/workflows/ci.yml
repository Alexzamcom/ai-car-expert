name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test (локальная сборка)
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8.0.1 -t 30000 http://localhost:4173/
          node scripts/smoke.mjs http://localhost:4173/ smoke-local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-local
          path: smoke-local
          if-no-files-found: ignore
