name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Ручной запуск той же проверки для любой ветки (например, если запуск по pull_request не стартовал).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit-тесты
        run: npm test
      - run: npm run build
      - name: Подготовка Chromium и локальной сборки
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8.0.1 -t 30000 http://localhost:4173/
      - name: Автономная навигация с тестовым мостом датчиков
        if: contains(fromJSON('["codex/gps-denied-navigation","codex/note9-navigation-hud","codex/android-navigation-ux","codex/android-offline-smooth","codex/android-hybrid-position","codex/android-confirmed-route","codex/android-navigation-scale","codex/android-location-bootstrap","codex/game-hud","codex/android-road-test","codex/android-location-report","codex/android-position-visibility"]'), github.head_ref)
        run: node scripts/autonomy-webview-check.mjs http://localhost:4173/
      - name: Android — главный экран, динамическое ведение и HUD
        if: (github.head_ref == 'codex/android-navigation-ux' || (github.head_ref == 'codex/android-offline-smooth' || (github.head_ref == 'codex/android-hybrid-position' || (github.head_ref == 'codex/android-confirmed-route' || (github.head_ref == 'codex/android-navigation-scale' || (github.head_ref == 'codex/android-location-bootstrap' || (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || github.head_ref == 'codex/android-position-visibility')))))))))
        run: node scripts/android-ux-check.mjs http://localhost:4173/ android-ux-visuals
      - uses: actions/upload-artifact@v4
        if: always() && (github.head_ref == 'codex/android-navigation-ux' || (github.head_ref == 'codex/android-navigation-scale' || (github.head_ref == 'codex/android-location-bootstrap' || (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || github.head_ref == 'codex/android-position-visibility'))))))
        with:
          name: android-ux-visuals
          path: android-ux-visuals/*.png
          if-no-files-found: ignore
      - name: Android — игровой HUD без сети
        if: (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || github.head_ref == 'codex/android-position-visibility')))
        run: ACE_GAME_HUD=1 ACE_HUD_VIDEO=1 node scripts/android-ux-check.mjs http://localhost:4173/ game-hud-visuals
      - uses: actions/upload-artifact@v4
        if: always() && (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || github.head_ref == 'codex/android-position-visibility')))
        with:
          name: game-hud-visuals
          path: |
            game-hud-visuals/*.png
            game-hud-visuals/game-hud-turn.webm
          if-no-files-found: error
      - name: Android — камера, ориентация и полноэкранный выбор места
        if: (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || github.head_ref == 'codex/android-position-visibility'))
        run: ACE_ROAD_TEST=1 node scripts/android-ux-check.mjs http://localhost:4173/ road-test-visuals
      - name: Запись подъёма и возврата камеры
        if: (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || github.head_ref == 'codex/android-position-visibility'))
        run: ACE_CAMERA_VIDEO=1 ACE_HUD_VIDEO=1 node scripts/android-ux-check.mjs http://localhost:4173/ road-test-visuals
      - uses: actions/upload-artifact@v4
        if: always() && (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || github.head_ref == 'codex/android-position-visibility'))
        with:
          name: road-test-visuals
          path: |
            road-test-visuals/*.png
            road-test-visuals/road-test-camera.webm
          if-no-files-found: error
      - name: Android — загрузка области и проверка без сети и GPS
        if: (github.head_ref == 'codex/android-offline-smooth' || (github.head_ref == 'codex/android-hybrid-position' || (github.head_ref == 'codex/android-confirmed-route' || (github.head_ref == 'codex/android-navigation-scale' || (github.head_ref == 'codex/android-location-bootstrap' || (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || github.head_ref == 'codex/android-position-visibility'))))))))
        run: node scripts/android-offline-check.mjs http://localhost:4173/
      - name: Android — гибридное определение положения
        if: (github.head_ref == 'codex/android-hybrid-position' || (github.head_ref == 'codex/android-confirmed-route' || (github.head_ref == 'codex/android-navigation-scale' || (github.head_ref == 'codex/android-location-bootstrap' || (github.head_ref == 'codex/game-hud' || (github.head_ref == 'codex/android-road-test' || (github.head_ref == 'codex/android-location-report' || github.head_ref == 'codex/android-position-visibility')))))))
        run: node scripts/android-hybrid-check.mjs http://localhost:4173/
      - name: Интерфейс ведения, прибытие и прогресс HUD
        run: node scripts/driving-ux-check.mjs http://localhost:4173/ smoke-local/driving-ux
      - name: Привязка машинки к векторным тайлам
        run: node scripts/road-matching-check.mjs http://localhost:4173/
      - name: Скриншоты игровой камеры, масштаб, ориентация и HUD
        run: node scripts/camera-check.mjs http://localhost:4173/ game-camera-visuals --visual
      - uses: actions/upload-artifact@v4
        with:
          name: game-camera-visuals
          path: game-camera-visuals/*.png
          if-no-files-found: error
      - name: Smoke test (локальная сборка, сервисы подменены тестовыми данными)
        run: node scripts/smoke.mjs http://localhost:4173/ smoke-local --mock
      - name: «Мои места» — постоянный профиль браузера (перезапуск, резервная копия, перенос прежних данных)
        run: node scripts/places-check.mjs http://localhost:4173/ smoke-local/places --mock
      - name: Динамическая камера «Игровой 3D» — движение, поворот, остановка, потеря GPS, ручной обзор
        run: node scripts/camera-check.mjs http://localhost:4173/ smoke-local/camera
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-local
          path: smoke-local
          if-no-files-found: ignore

  # Длительный тест MapLibre 3D: 15 минут ведения с GPS раз в секунду, жестами и 3D-машинкой на iPad, iPhone и Android
  # (параллельно). Проверяет, что карта не пересоздаётся, стиль не перезагружается (мерцание), WebGL не теряется.
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        look: [normal, game, game-night]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Длительный тест MapLibre (15 мин, тестовые данные, вид ${{ matrix.look }})
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8.0.1 -t 30000 http://localhost:4173/
          node scripts/soak.mjs http://localhost:4173/ soak-local --mock --minutes=15 --look=${{ matrix.look }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-local-${{ matrix.look }}
          path: soak-local
          if-no-files-found: ignore

  # «Игровая 3D» на настоящих тайлах OpenFreeMap (Днепр, Павлоград): снимки в журнал и ориентировочная плавность.
  # Зависит от сети — не блокирует CI.
  map-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Снимки «Игровой 3D»
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8.0.1 -t 30000 http://localhost:4173/
          node scripts/map-preview.mjs http://localhost:4173/ map-preview
