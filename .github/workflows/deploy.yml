name: Deploy test version (GitHub Pages)

# Тестовое размещение: статическая сборка публикуется в ветку gh-pages
# и раздаётся GitHub Pages по HTTPS. Никакие серверы не затрагиваются.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Метка версии
        run: |
          touch dist/.nojekyll
          printf '{"commit":"%s","built":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > dist/version.json
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Публикация тестовой версии'

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ожидание публикации
        run: |
          URL="$(echo "$SITE_URL" | tr '[:upper:]' '[:lower:]')"
          echo "SITE_URL=$URL" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            # Ждём именно эту сборку: GitHub Pages обновляется не мгновенно.
            live=$(curl -s "${URL}version.json?nocache=$i" | grep -o '"commit":"[0-9a-f]*"' | cut -d'"' -f4 || true)
            echo "attempt $i: на сайте ${live:-нет version.json}, ожидается $GITHUB_SHA"
            if [ "$live" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::На $URL не появилась сборка $GITHUB_SHA. Проверьте Settings → Pages: источник — ветка gh-pages."
          exit 1
      - name: Проверка ресурсов
        run: |
          for p in manifest.webmanifest sw.js icons/apple-touch-icon.png icons/icon-512.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_URL}${p}")
            echo "$p → $code"; [ "$code" = "200" ]
          done
          echo "Overpass (прямоугольник у Тверской, как в приложении):"
          Q='[out:json][timeout:12];(nwr["amenity"="fuel"](55.75,37.59,55.79,37.63););out center 80;'
          SAFARI_UA='Mozilla/5.0 (iPad; CPU OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          for s in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            meta=$(curl -s -m 20 -o /tmp/op.json -w 'HTTP %{http_code}, %{time_total} с' --data-urlencode "data=$Q" "$s" || true)
            echo "$s → $meta, АЗС: $(grep -o '"amenity"' /tmp/op.json 2>/dev/null | wc -l)"
            # Тот же запрос как из Safari на iPad: отличает блокировку клиента от блокировки IP.
            meta=$(curl -s -m 20 -o /tmp/op.json -w 'HTTP %{http_code}, %{time_total} с' -A "$SAFARI_UA" \
              -H 'Origin: https://alexzamcom.github.io' -H 'Referer: https://alexzamcom.github.io/ai-car-expert/' \
              --data-urlencode "data=$Q" "$s" || true)
            echo "  как Safari → $meta, АЗС: $(grep -o '"amenity"' /tmp/op.json 2>/dev/null | wc -l)"
          done
          echo "Radio Browser:"
          curl -s -m 10 -o /dev/null -w "all.api /json/servers → %{http_code}\n" https://all.api.radio-browser.info/json/servers || true
          echo "Радиопотоки:"
          for s in https://stream.radioparadise.com/mp3-128 https://ice1.somafm.com/groovesalad-128-mp3 \
                   "https://router.project-osrm.org/route/v1/driving/37.6156,55.757;37.617,55.779?overview=false" \
                   "https://de1.api.radio-browser.info/json/stats"; do
            code=$(curl -s -o /dev/null -r 0-1000 --max-time 10 -w '%{http_code}' "$s" || true); echo "$s → $code"
          done
      - name: Smoke test опубликованной версии
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/smoke.mjs "$SITE_URL" smoke-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-live
          path: smoke-live
          if-no-files-found: ignore
