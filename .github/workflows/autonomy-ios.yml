name: Experimental iOS Simulator
on:
  pull_request:
    paths: [ios/**, src/lib/autonomy/**, src/sections/AutonomousNavigation.tsx, .github/workflows/autonomy-ios.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'codex/gps-denied-navigation' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Compile the native simulator app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/ace-ios" \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent "$RUNNER_TEMP/ace-ios/Build/Products/Debug-iphonesimulator/App.app" ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ai-car-expert-ios-simulator
          path: ios-simulator.zip
          if-no-files-found: error
