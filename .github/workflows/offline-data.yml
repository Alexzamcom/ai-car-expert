name: Build real offline map data

on:
  pull_request:
    paths: ['server/offline-maps/**', '.github/workflows/offline-data.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ace-offline-map-data
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'pull_request' || (github.head_ref == 'codex/android-offline-download' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          pip install osmium==4.3.0
      - name: Download licensed OSM data and glyphs
        run: |
          mkdir -p "$RUNNER_TEMP/ace-input/glyphs"
          cd "$RUNNER_TEMP/ace-input"
          curl -fL --retry 3 -o ukraine.osm.pbf https://download.geofabrik.de/europe/ukraine-latest.osm.pbf
          for range in 0-255 256-511 1024-1279 8192-8447; do
            curl -fL --retry 2 -o "glyphs/$range.pbf" "https://raw.githubusercontent.com/protomaps/basemaps-assets/028c18f713baecad011301ff7a69acc39bcc2ae7/fonts/Noto%20Sans%20Regular/$range.pbf"
          done
          date=$(osmium fileinfo -g header.option.osmosis_replication_timestamp ukraine.osm.pbf)
          printf '%s\n' "${date:-$(date -u +%FT%TZ)}" > data-date
      - name: Build Pavlohrad and Dnipro (25 km)
        run: |
          input="$RUNNER_TEMP/ace-input"
          python server/offline-maps/build.py --source "$input/ukraine.osm.pbf" --glyphs "$input/glyphs" \
            --date "$(cat "$input/data-date")" --out "$RUNNER_TEMP/ace-data" --radii 25
          du -sh "$RUNNER_TEMP"/ace-data/regions/*/*
      - name: Upload test data
        uses: actions/upload-artifact@v4
        with:
          name: real-offline-maps
          path: ${{ runner.temp }}/ace-data
          retention-days: 14
      - name: Publish licensed data to the data-only branch
        run: |
          data="$RUNNER_TEMP/ace-data"
          origin=$(git config --get remote.origin.url)
          git -C "$data" init -b offline-map-data
          git -C "$data" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$data" config user.name "github-actions[bot]"
          printf '%s\n' '© OpenStreetMap contributors, ODbL 1.0. Source https://download.geofabrik.de/europe/ukraine.html' > "$data/ATTRIBUTION.txt"
          if git fetch --no-tags origin offline-map-data; then
            git -C "$data" remote add origin "$origin"
            git -C "$data" -c "http.extraheader=$(git config --get http.https://github.com/.extraheader)" fetch --depth=1 origin offline-map-data
            git -C "$data" reset --mixed FETCH_HEAD
          fi
          git -C "$data" add -A
          git -C "$data" diff --cached --quiet && exit 0
          git -C "$data" commit -m "Refresh offline road data from Geofabrik"
          git -C "$data" -c "http.extraheader=$(git config --get http.https://github.com/.extraheader)" push "$origin" HEAD:offline-map-data
