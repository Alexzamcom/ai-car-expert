name: Traffic proxy (TomTom)

# Сервер пробок AI Car Expert: отдельный Cloudflare Worker «ai-car-expert-traffic».
# Не затрагивает другие Worker'ы аккаунта (ИИ-прокси, Yenota, TVoy Hub): wrangler работает только с этим именем
# и с хранилищем «ai-car-expert-traffic-usage».
#
# Секреты:
#   GitHub → Settings → Secrets → Actions: CLOUDFLARE_API_TOKEN (шаблон «Edit Cloudflare Workers»).
#   Cloudflare → ai-car-expert-traffic → Settings → Variables and Secrets: TOMTOM_KEY (ключ TomTom — только там).
#
# Действия (Actions → Traffic proxy (TomTom) → Run workflow):
#   deploy — развернуть или обновить Worker и хранилище счётчиков;
#   diag   — проверка реальных данных TomTom: Павлоград, Днепр, трасса между ними, маршрут с пробками (~20 запросов);
#   usage  — расход квоты по счётчикам Worker;
#   terms  — выдержки из действующих условий и лимитов TomTom (для проверки лицензии поверх OpenFreeMap).

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy | diag | usage | terms'
        required: true
        default: deploy
  push:
    branches: [main]
    paths: ['server/traffic-proxy/**']

permissions:
  contents: read

concurrency:
  group: traffic-proxy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTION: ${{ github.event.inputs.action || 'deploy' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: server/traffic-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Условия и лимиты TomTom (выдержки)
        if: env.ACTION == 'terms'
        run: |
          for u in https://developer.tomtom.com/pricing \
                   https://docs.tomtom.com/pricing/price-announcement \
                   https://developer.tomtom.com/terms-and-conditions \
                   https://docs.tomtom.com/traffic-api/documentation/tomtom-maps/v1/product-information/market-coverage \
                   https://docs.tomtom.com/traffic-api/documentation/tomtom-maps/traffic-flow/raster-flow-tiles; do
            echo "=================== $u"
            curl -sL -m 30 -A 'Mozilla/5.0' "$u" -o /tmp/page.html || { echo "недоступно"; continue; }
            python3 - <<'PY'
          import re, html
          t = open('/tmp/page.html', encoding='utf-8', errors='ignore').read()
          t = re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>', ' ', t)
          t = html.unescape(re.sub(r'<[^>]+>', '\n', t))
          lines = [l.strip() for l in t.split('\n') if l.strip()]
          keys = re.compile(r'(?i)(traffic|free|month|daily|per day|transactions|request|tile|ukraine|openstreetmap|third.party|overlay|combin|cache|caching|store|display|attribution|commercial|non-commercial|freemium|limit)')
          out = [l for l in lines if keys.search(l) and len(l) < 400]
          print('\n'.join(out[:160]) if out else '(текст не найден — страница рендерится скриптом)')
          PY
          done

      - name: Проверка токена Cloudflare
        if: env.ACTION != 'terms'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Нет секрета CLOUDFLARE_API_TOKEN (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi
          ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('result') or [];print(r[0]['id'] if r else '')")
          if [ -z "$ACC" ]; then echo "::error::Токен не дал доступ ни к одному аккаунту Cloudflare."; exit 1; fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain" | python3 -c "import json,sys;d=json.load(sys.stdin);print((d.get('result') or {}).get('subdomain',''))")
          if [ -z "$SUB" ]; then echo "::error::У аккаунта не выбран поддомен workers.dev (Cloudflare → Workers & Pages → при первом входе)."; exit 1; fi
          echo "WORKER_URL=https://ai-car-expert-traffic.$SUB.workers.dev" >> "$GITHUB_ENV"

      - name: Развёртывание (Worker и хранилище счётчиков)
        if: env.ACTION == 'deploy'
        run: |
          W="npx --yes wrangler@3.114.0"
          ID=$($W kv namespace list 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((n['id'] for n in d if n['title'] in ('ai-car-expert-traffic-usage','ai-car-expert-traffic-USAGE')),''))" || true)
          if [ -z "$ID" ]; then
            ID=$($W kv namespace create ai-car-expert-traffic-usage 2>&1 | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          [ -n "$ID" ] || { echo "::error::Не удалось создать хранилище KV"; exit 1; }
          sed -e 's/^# \[\[kv_namespaces\]\]/[[kv_namespaces]]/' -e 's/^# binding = "USAGE"/binding = "USAGE"/' -e "s/^# id = \"<id>\"/id = \"$ID\"/" wrangler.toml > wrangler.ci.toml
          grep -A2 kv_namespaces wrangler.ci.toml
          $W deploy --config wrangler.ci.toml
          echo "Адрес: $WORKER_URL"
          curl -s "$WORKER_URL/health"; echo
          echo "Если configured=false — добавьте секрет TOMTOM_KEY: Cloudflare → Workers & Pages → ai-car-expert-traffic → Settings → Variables and Secrets."

      - name: Проверка реальных данных TomTom
        if: env.ACTION == 'diag'
        run: |
          curl -s "$WORKER_URL/health"; echo
          curl -s -m 120 "$WORKER_URL/diag" | python3 -m json.tool

      - name: Расход квоты
        if: env.ACTION == 'usage'
        run: curl -s "$WORKER_URL/usage" | python3 -m json.tool
